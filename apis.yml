specificationVersion: '0.19'
apis:
  - aid: visual-studio-code:extension-api
    name: Visual Studio Code Extension API
    description: >-
      Programmatic TypeScript / JavaScript API for building VS Code
      extensions. The Extension API exposes editor UI, language features,
      debugging adapters, themes, webviews, source control providers, tasks,
      and more. It is not a REST API and has no base URL or authentication
      scheme; extensions run inside the VS Code process and are distributed
      through the Visual Studio Marketplace.
    humanURL: https://code.visualstudio.com/api
    tags:
      - Extension API
      - Editor Customization
      - Language Server
      - Debug Adapter
