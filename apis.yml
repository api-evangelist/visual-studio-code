aid: visual-studio-code
name: Visual Studio Code
description: >-
  Visual Studio Code is a free, open-source, cross-platform code editor
  developed by Microsoft for Windows, Linux, macOS, and the web, built on
  the MIT-licensed Code - OSS project and distinguished by features such
  as IntelliSense, debugging, integrated Git, and a marketplace with tens
  of thousands of extensions. VS Code is not a SaaS REST API; instead,
  developers extend the editor through the Extension API, a TypeScript /
  JavaScript programmatic interface that exposes nearly every aspect of
  the editor for customization. This index points to the Extension API
  documentation and surrounding developer resources.
